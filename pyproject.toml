[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gcode2image"
authors = [{name = "Johannes Noordanus", email = "mailjohannes.mailnoordanus@gmail.com"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version", "description"]

dependencies = [
    "numpy >= 1.24.3, <= 2.4.6",
    "Pillow >= 12.2.0",
]

requires-python = ">=3.11"

[project.scripts]
gcode2image = "gcode2image:main"

[project.urls]
Home = "https://github.com/johannesnoordanus/gcode2image"
